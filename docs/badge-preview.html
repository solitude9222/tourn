<!doctype html><meta charset="utf-8"><title>Tourn badge refresh</title><style>body{margin:0;padding:32px;background:#0b0d12;color:#eee;font:14px system-ui}h1{font-size:22px;margin:0 0 8px}p{color:#9ca8be;margin:0 0 24px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}article{padding:26px 12px;border:1px solid #293244;border-radius:14px;background:#131924;text-align:center}img{display:block;width:52px;height:52px;margin:0 auto 16px}button{margin-top:24px;padding:10px 14px;border:1px solid #38528b;background:#1a2843;color:#b9ceff;border-radius:8px;cursor:pointer}</style><h1>Tourn badge refresh</h1><p>Four filled designs · SVG motion · static variants included</p><div class="grid"><article><img src="../public/badges/v2/developer.svg" alt="developer"><b>Developer</b></article><article><img src="../public/badges/v2/staff.svg" alt="staff"><b>Staff</b></article><article><img src="../public/badges/v2/booster.svg" alt="booster"><b>Booster</b></article><article><img src="../public/badges/v2/bughunter.svg" alt="bughunter"><b>Bug Hunter</b></article></div><button onclick="const still=this.dataset.still!=='yes';document.querySelectorAll('img').forEach(img=>img.src=img.src.replace(/\/still\//,'/').replace('/v2/','/v2/'+(still?'still/':'')));this.dataset.still=still?'yes':'no';this.textContent=still?'Play animation':'Show static icons'">Show static icons</button>
