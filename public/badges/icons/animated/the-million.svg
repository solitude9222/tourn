<svg class="themillion_svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="64" height="64"><style>@keyframes themillion_w{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}.themillion_cn{animation:themillion_w 1.2s ease-in-out infinite;transform-origin:6px 20px}@keyframes themillion_cb{0%{opacity:0;transform:translate(-3px,3px) scale(.4)}25%{opacity:1}100%{opacity:0;transform:translate(3px,-4px) scale(1.1)}}.themillion_cf{transform-box:fill-box;transform-origin:center;opacity:0;animation:themillion_cb 1.6s ease-out infinite}@media(prefers-reduced-motion:reduce){.themillion_svg *{animation:none!important}}</style><g class="themillion_cn"><path d="M3.500 21L8 8l8 8z" fill="#27d3c0" stroke="#27d3c0" stroke-width="1.500" stroke-linejoin="round"/><path d="M6.500 14.500l3 3M8.500 11l5 5" stroke="#0b7a6d" stroke-width="1.600" stroke-linecap="round"/></g><g stroke="#9ff7ec" stroke-width="2.200" stroke-linecap="round"><path class="themillion_cf" style="animation-delay:0s" d="M13 4.500l1-2.500"/><path class="themillion_cf" style="animation-delay:.4s" d="M18 8l3-1"/><path class="themillion_cf" style="animation-delay:.8s" d="M17 3.500l.6 2.600"/><path class="themillion_cf" style="animation-delay:1.2s" d="M20 12.500l1.500 1"/></g></svg>
