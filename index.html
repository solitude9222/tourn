<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>tourn.lol — one link for everything you play</title>
    <meta
      name="description"
      content="tourn.lol is a bio link for people who play. One short link with your Discord, your server, your Spotify and your Steam profile, kept live automatically."
    />
    <meta name="theme-color" content="#02070d" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <meta property="og:title" content="tourn.lol — one link for everything you play" />
    <meta
      property="og:description"
      content="Claim your handle. Discord, your server, Spotify and Steam stay live on one clean bio page."
    />
    <meta property="og:image" content="/logo.png" />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://cdn.discordapp.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Fonts load without blocking the first paint; the stack falls back to
         system sans until they land. -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <!--
      Runtime public env (/env.js → API, whitelisted public values only) is
      fetched by src/lib/backend.ts instead of being a blocking script here,
      so the bundle starts without waiting for the API host.
    -->
    <!-- First paint: a plain black screen. Nothing to download, nothing to
         animate — a profile page paints the moment React has its data, and an
         entry screen never sits behind a splash the visitor didn't choose. -->
    <style>
      html,
      body {
        background: #000;
        color: #eaf3f8;
      }
      body {
        margin: 0;
      }
      #root {
        min-height: 100vh;
      }
    </style>
  </head>
  <body>
    <noscript>
      <style>
        [data-reveal] {
          opacity: 1 !important;
          translate: none !important;
          filter: none !important;
        }
      </style>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
