<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Start public profile data before the application bundle is downloaded. -->
    <script>
      (() => {
        try {
          const hash = location.hash.replace(/^#\/?/, "");
          const raw = hash.startsWith("profile/") ? hash.split(/[/?]/)[1] : !location.hash ? location.pathname.split("/").filter(Boolean)[0] : "";
          const reserved = new Set(["dashboard", "admin", "shop", "cart", "premium", "leaderboard", "legal", "demo", "about", "profile", "login", "signin", "signup", "help", "support", "api", "assets", "badges"]);
          const handle = decodeURIComponent(raw || "").trim().toLowerCase();
          if (!handle || reserved.has(handle) || /\.[a-z0-9]+$/i.test(handle)) return;
          window.__TOURN_PROFILE_REQUEST__ = { handle, promise: fetch("/api/profile/" + encodeURIComponent(handle), { credentials: "include", cache: "no-store", headers: { Accept: "application/json" } }).then(async response => ({ ok: response.ok, status: response.status, data: await response.json() })).catch(() => null) };
        } catch { /* A malformed URL must not prevent application startup. */ }
      })();
    </script>
    <title>tourn | Home</title>
    <meta
      name="description"
      content="tourn.lol is a bio link for people who play. One short link with your Discord, your server, your Spotify and your Steam profile, kept live automatically."
    />
    <meta name="theme-color" content="#09090b" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="/favicon.ico?v=2" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=2" />
    <link rel="icon" type="image/svg+xml" href="/brand/favicon-blue.svg?v=2" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2" />
    <meta property="og:title" content="tourn.lol — one link for everything you play" />
    <meta
      property="og:description"
      content="Claim your handle. Discord, your server, Spotify and Steam stay live on one clean bio page."
    />
    <meta property="og:image" content="/brand/tourn-logo-generated.png" />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://cdn.discordapp.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Fonts load without blocking the first paint; the stack falls back to
         system sans until they land. -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Lexend:wght@300..800&family=Outfit:wght@300..800&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Lexend:wght@300..800&family=Outfit:wght@300..800&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <!--
      The static /env.js holds only the public API base (no owner email, keys
      or OAuth secrets) and is fetched by src/lib/backend.ts instead of being
      a blocking script here, so the bundle starts without waiting for the
      API host.
    -->
    <!-- First paint: a plain charcoal screen. Nothing to download, nothing to
         animate — a profile page paints the moment React has its data, and an
         entry screen never sits behind a splash the visitor didn't choose. -->
    <style>
      html,
      body {
        background: #09090b;
        color: #f5f5f7;
      }
      body {
        margin: 0;
      }
      #root {
        min-height: 100vh;
      }
    </style>
  </head>
  <body>
    <noscript>
      <style>
        [data-reveal] {
          opacity: 1 !important;
          translate: none !important;
          filter: none !important;
        }
      </style>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
